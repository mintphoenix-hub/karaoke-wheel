kind = "web"
previewPath = "/"
title = "Karaoke Spin Wheel"
version = "1.0.0"
id = "artifacts/karaoke-wheel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20007

[services.development]
run = "pnpm --filter @workspace/karaoke-wheel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/karaoke-wheel", "run", "build" ]
publicDir = "artifacts/karaoke-wheel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20007"
BASE_PATH = "/"
